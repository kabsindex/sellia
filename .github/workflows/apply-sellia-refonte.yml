name: Apply SELLIA refonte patch

on:
  push:
    branches:
      - feat/sellia-refonte-complete-final
    paths:
      - '.github/workflows/apply-sellia-refonte.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/sellia-refonte-complete-final
          fetch-depth: 0

      - name: Apply cumulative SELLIA patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          base64 -d .sellia-refonte-final.bz2.b64 > /tmp/sellia-refonte.patch.bz2
          bzip2 -tv /tmp/sellia-refonte.patch.bz2
          bzip2 -dc /tmp/sellia-refonte.patch.bz2 > /tmp/sellia-refonte.patch

          if ! git am --3way /tmp/sellia-refonte.patch; then
            echo "Resolving expected landing refonte conflicts in favor of the cumulative patch..."

            git rm -f --               src/components/marketing/Faq.tsx               src/components/marketing/Features.tsx               src/components/marketing/FinalCta.tsx               src/components/marketing/Hero.tsx               src/components/marketing/HowItWorks.tsx               src/components/marketing/MarketingFooter.tsx               src/components/marketing/MarketingNav.tsx               src/components/marketing/Pricing.tsx               src/components/marketing/StorePreviewSection.tsx               src/components/marketing/Testimonials.tsx

            git checkout --theirs --               src/components/marketing/PhoneFrame.tsx               src/data/landing.ts               src/pages/Landing.tsx

            git add -A

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unexpected unresolved conflicts remain:"
              git diff --name-only --diff-filter=U
              git am --abort || true
              exit 1
            fi

            GIT_EDITOR=true git am --continue
          fi

          git rm .sellia-refonte-final.bz2.b64 .github/workflows/apply-sellia-refonte.yml
          git commit -m "chore: remove refonte staging files"
          git push origin HEAD:feat/sellia-refonte-complete-final
